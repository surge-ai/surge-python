name: CI

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            .github/workflows/ci.yml

      - name: Install dependencies
        run: python -m pip install -r requirements.txt build==1.6.1 twine==7.0.0 yapf==0.43.0

      - name: Check formatting
        run: yapf --diff -r -e '.cci_pycache/**' .

      - name: Run tests
        run: python -m pytest

      - name: Build source distribution and wheel
        run: python -m build

      - name: Validate distributions
        run: python -m twine check --strict dist/*

      - name: Check installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-venv/bin/python" -I - <<'PY'
          from importlib.metadata import version
          from platform import python_version
          from unittest.mock import Mock, patch

          from surge._version import __version__
          from surge.api_resource import APIResource

          assert __version__ == version("surge-api")
          response = Mock()
          response.json.return_value = {}
          with patch("requests.sessions.Session.send", return_value=response) as send:
              APIResource._base_request("get", "projects", api_key="test-key")
          user_agent = send.call_args.args[0].headers["User-Agent"]
          assert user_agent == f"surge-python/{__version__} Python/{python_version()}"
          print(f"Installed wheel verified: {user_agent}")
          PY
